name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install cmake (for libsamplerate WASM build)
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - name: Install npm dependencies
        run: npm ci

      - name: Build WASM
        run: npm run build:wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Build TypeScript bundles
        run: npm run build:ts

      - name: Parity with upstream 0.1.0
        run: npm run parity

      - name: Sanity-check dist contents
        run: |
          test -f dist/index.mjs
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/wasm/libsamplerate.wasm
          test -f dist/wasm/libsamplerate.js
          ls -lh dist dist/wasm
